name: Frontend CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: "cms-frontend/package-lock.json"

      - name: Install dependencies
        working-directory: "cms-frontend"
        run: npm ci

      - name: Build Angular application
        working-directory: "cms-frontend"
        run: npm run build