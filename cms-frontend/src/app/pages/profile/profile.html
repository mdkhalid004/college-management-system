<div class="container-fluid p-4">
  <h4 class="fw-bold mb-4">My Profile</h4>
  
  <div class="card shadow-sm border-0" style="max-width: 600px;">
    <div class="card-body">
      
      <!-- Profile Header (Photo & Name) -->
      <div class="text-center mb-4">
        <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center mx-auto mb-3 shadow" style="width: 100px; height: 100px; font-size: 2.5rem;">
          A
        </div>
        <h5 class="fw-bold mb-1">Admin User</h5>
        <p class="text-muted mb-2">admin@cms.com</p>
        <span class="badge bg-success px-3 py-2">Super Admin</span>
      </div>

      <hr>

<!-- Profile Details Form -->
      <form class="mt-4">
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label text-muted fw-bold small">First Name</label>
            <!-- [readonly] aur background color bind kiya gaya hai -->
            <input type="text" class="form-control" [class.bg-light]="!isEditing" value="Admin" [readonly]="!isEditing">
          </div>
          <div class="col-md-6 mt-3 mt-md-0">
            <label class="form-label text-muted fw-bold small">Last Name</label>
            <input type="text" class="form-control" [class.bg-light]="!isEditing" value="User" [readonly]="!isEditing">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted fw-bold small">Email Address</label>
          <input type="email" class="form-control" [class.bg-light]="!isEditing" value="admin@cms.com" [readonly]="!isEditing">
        </div>

        <div class="mb-4">
          <label class="form-label text-muted fw-bold small">Phone Number</label>
          <input type="text" class="form-control" [class.bg-light]="!isEditing" value="+91 9876543210" [readonly]="!isEditing">
        </div>

        <!-- Real Edit & Save Buttons -->
        <div class="d-flex justify-content-end">
          
          <!-- Edit Button (Jab editing OFF ho tab dikhega) -->
          <button *ngIf="!isEditing" type="button" class="btn btn-primary px-4" (click)="toggleEdit()">
            <i class="bi bi-pencil-square me-2"></i> Edit Profile
          </button>
          
          <!-- Save Button (Jab editing ON ho tab dikhega) -->
          <button *ngIf="isEditing" type="button" class="btn btn-success px-4" (click)="toggleEdit()">
            <i class="bi bi-check-circle me-2"></i> Save Changes
          </button>
          
        </div>
      </form>

    </div>
  </div>
</div>
